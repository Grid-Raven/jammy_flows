name: Export source snapshot

on:
  push:
    branches:
      - assistant-export-pr5

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr5-source
          path: |
            jammy_flows
            tests
            setup.py
            requirements.txt
